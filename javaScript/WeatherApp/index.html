<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="outer_container">
        <div class="loader">Loading weather...</div>
        <div class="container">
            <h1>Weather App</h1>

            <div class="inputbox_container">
                <input type="text" name="" id="input_box">
                <button id="search_button">Search City</button>
            </div>
            <div>
                <div class="city_name"></div>
                <div class="weather_icon">
                    <img src="/" alt="clouds">
                </div>

                <div class="temperature"></span></div>
                <div class="condition"></div>
            </div>

            <div>
                <div class="humidity_container">
                    <p>Humidity</p>
                    <p class="humidity_unit"></p>
                </div>
                <div class="windspeed_container">
                    <p>Windspeed</p>
                    <p class="windspeed_unit"></p>
                </div>
                <div class="visibility_container">
                    <p>Visibility</p>
                    <p class="visibility_unit"></p>
                </div>
                <div class="pressure_container">
                    <p>Pressure</p>
                    <p class="pressure_unit"></p>
                </div>
            </div>

        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
